<!doctype html>
<!-- Spark 测试报告模板；Template for the Spark-style test report. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BDD Autowork Report</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #dde2e8;
      --text: #1f2933;
      --muted: #687385;
      --nav: #1f2329;
      --nav2: #292f37;
      --pass: #1e9b64;
      --fail: #d14343;
      --skip: #b7791f;
      --info: #1b72c9;
      --unknown: #737b88;
      --shadow: 0 10px 26px rgba(31, 35, 41, 0.08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    .shell {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      background: var(--nav);
      color: #eef2f7;
      padding: 20px 16px;
      height: 100vh;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      padding: 6px 4px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1e9b64, #1b72c9);
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .brand-subtitle {
      color: #aab4c2;
      font-size: 12px;
      margin-top: 2px;
    }

    .nav-section {
      color: #8f9aaa;
      font-size: 11px;
      text-transform: uppercase;
      margin: 20px 8px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #d8dee8;
      padding: 9px 10px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--nav2);
      color: #ffffff;
    }

    .nav-count {
      min-width: 22px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #dce3ee;
      font-size: 11px;
    }

    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .feature-item {
      align-items: flex-start;
      gap: 8px;
    }

    .feature-main {
      min-width: 0;
      flex: 1;
    }

    .feature-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .feature-meta {
      color: #9ba6b5;
      font-size: 11px;
      margin-top: 4px;
      line-height: 1.4;
    }

    .feature-badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 7px;
    }

    .mini-count {
      height: 18px;
      min-width: 18px;
      padding: 0 6px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.1);
    }

    .mini-pass { color: #9be2be; }
    .mini-fail { color: #ffb4b4; }
    .mini-skip { color: #ffd58d; }

    .content {
      padding: 22px 26px 36px;
      min-width: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 6px;
      letter-spacing: 0;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .search {
      min-width: 260px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      background: #ffffff;
      color: var(--text);
      font-size: 13px;
    }

    .segmented {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: #ffffff;
    }

    .segmented button {
      border: 0;
      background: transparent;
      padding: 9px 12px;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
    }

    .segmented button.active {
      background: #edf2f7;
      color: var(--text);
      font-weight: 600;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 700;
    }

    .metric.pass .metric-value { color: var(--pass); }
    .metric.fail .metric-value { color: var(--fail); }
    .metric.skip .metric-value { color: var(--skip); }
    .metric.info .metric-value { color: var(--info); }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(360px, 1.05fr) minmax(420px, 1.35fr);
      gap: 16px;
      align-items: start;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
    }

    .panel-body {
      padding: 14px 16px;
    }

    .main-grid > .panel {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .main-grid > .panel .panel-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #detailBody {
      overflow: auto;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 22px;
      padding: 0 8px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-pass { background: rgba(30, 155, 100, 0.12); color: var(--pass); }
    .status-fail { background: rgba(209, 67, 67, 0.12); color: var(--fail); }
    .status-skip { background: rgba(183, 121, 31, 0.14); color: var(--skip); }
    .status-unknown { background: rgba(115, 123, 136, 0.14); color: var(--unknown); }

    .scenario-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
      overflow: auto;
      padding-right: 2px;
    }

    .scenario-card {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 12px;
      cursor: pointer;
      background: #ffffff;
      position: relative;
      transition: border-color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }

    .scenario-card.outline-row {
      border-left: 4px solid var(--info);
      background: #f7fbff;
      box-shadow: inset 0 0 0 1px rgba(27, 114, 201, 0.08);
    }

    .scenario-card.example-row {
      margin-left: 34px;
      position: relative;
      background: #fcfdff;
      border-color: #cfdae6;
    }

    .scenario-card.example-row::before {
      content: "";
      position: absolute;
      left: -15px;
      top: -9px;
      width: 18px;
      height: calc(50% + 9px);
      border-left: 2px solid #c9d6e2;
      border-bottom: 2px solid #c9d6e2;
      border-bottom-left-radius: 6px;
    }

    .outline-summary {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .outline-toggle {
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      margin-right: 6px;
      background: #e9f1fb;
      color: var(--info);
      font-size: 10px;
      font-weight: 900;
      vertical-align: 1px;
    }

    .scenario-error {
      margin-top: 9px;
      border-left: 3px solid var(--fail);
      background: #fff5f5;
      color: #8f2f2f;
      border-radius: 5px;
      padding: 7px 9px;
      font-size: 12px;
      line-height: 1.45;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .scenario-card:hover {
      border-color: #9bb7d4;
      background: #f8fbff;
    }

    .scenario-card.active {
      border-color: var(--info);
      background: #eef6ff;
      box-shadow: 0 0 0 2px rgba(27, 114, 201, 0.18), 0 10px 20px rgba(27, 114, 201, 0.12);
    }

    .scenario-card.active::after {
      content: "";
      position: absolute;
      left: -1px;
      top: 8px;
      bottom: 8px;
      width: 4px;
      border-radius: 0 3px 3px 0;
      background: var(--info);
    }

    .scenario-card.example-row.active::before {
      border-left-color: var(--info);
      border-bottom-color: var(--info);
    }

    .scenario-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }

    .scenario-name {
      font-weight: 700;
      font-size: 13px;
      line-height: 1.45;
    }

    .scenario-path {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .scenario-type {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      background: #edf2f7;
      color: #536173;
      margin-right: 6px;
    }

    .example-params {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .param-chip {
      border: 1px solid #d3dce6;
      background: #fbfcfd;
      border-radius: 10px;
      padding: 2px 7px;
      font-size: 11px;
      color: #536173;
    }

    .scenario-tags {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .tag {
      border: 1px solid var(--line);
      background: #f7f9fb;
      color: #536173;
      border-radius: 11px;
      padding: 2px 8px;
      font-size: 11px;
    }

    .detail-title-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .detail-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
    }

    .detail-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 14px 0;
    }

    .fact {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px;
      background: #fbfcfd;
    }

    .fact-label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 5px;
    }

    .fact-value {
      font-size: 13px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .step {
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
      background: #ffffff;
    }

    .step-main {
      display: grid;
      grid-template-columns: 26px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
    }

    .step-index {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #edf2f7;
      display: grid;
      place-items: center;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
    }

    .bdd-keyword {
      display: inline-flex;
      height: 20px;
      align-items: center;
      padding: 0 7px;
      border-radius: 10px;
      background: #e9f1fb;
      color: #275f9b;
      font-size: 11px;
      font-weight: 800;
      margin-right: 7px;
    }

    .action-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 10px;
    }

    .action-row {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px;
      background: #ffffff;
      font-size: 12px;
    }

    .action-name {
      font-weight: 700;
      color: #364152;
    }

    .action-target {
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .examples-table-wrap {
      margin: 12px 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
      background: #ffffff;
    }

    .examples-table-title {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 800;
      color: #364152;
      background: #fbfcfd;
    }

    .examples-table-scroll {
      overflow: auto;
      max-height: 220px;
    }

    .examples-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 360px;
    }

    .examples-table th,
    .examples-table td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    .examples-table th {
      background: #f4f7fa;
      color: #536173;
      font-weight: 800;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .examples-table tr:last-child td {
      border-bottom: 0;
    }

    .examples-table tbody tr {
      cursor: pointer;
    }

    .examples-table tbody tr:hover {
      background: #f0f7ff;
    }

    .step-name {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
    }

    .step-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .step-extra {
      border-top: 1px solid var(--line);
      padding: 10px 12px;
      background: #fbfcfd;
      display: none;
    }

    .step.failed .step-extra,
    .step.has-extra.open .step-extra {
      display: block;
    }

    .error-box {
      border-left: 4px solid var(--fail);
      background: #fff5f5;
      color: #8f2f2f;
      padding: 10px;
      border-radius: 6px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      overflow: auto;
      max-height: 180px;
    }

    .error-detail {
      margin-top: 10px;
      border: 1px solid #f0c7c7;
      border-radius: 7px;
      overflow: hidden;
      background: #fffafa;
    }

    .error-detail summary {
      cursor: pointer;
      padding: 9px 11px;
      color: #8f2f2f;
      font-weight: 700;
      font-size: 12px;
      user-select: none;
    }

    .error-detail pre {
      margin: 0;
      border-top: 1px solid #f0c7c7;
      padding: 10px 12px;
      background: #fff5f5;
      color: #7a2525;
      max-height: 280px;
      overflow: auto;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .attachment-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .attachment {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      max-width: 100%;
      padding: 6px 8px;
      font-size: 12px;
    }

    .attachment-type {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 10px;
      background: #edf2f7;
      color: #536173;
      font-size: 11px;
      font-weight: 800;
      flex: 0 0 auto;
      text-transform: uppercase;
    }

    .attachment-main {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .attachment-source {
      color: var(--muted);
      font-size: 11px;
    }

    .attachment a {
      color: var(--info);
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 7px;
      padding: 18px;
      color: var(--muted);
      text-align: center;
      background: #fbfcfd;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
    }

    .sidebar .brand {
      flex: 0 0 auto;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 18px;
      margin-bottom: 10px;
    }

    button.nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      font-family: inherit;
    }

    button.nav-item.active {
      background: var(--nav2);
      color: #ffffff;
      box-shadow: inset 3px 0 0 var(--pass);
    }

    .nav-symbol {
      width: 22px;
      height: 22px;
      border: 1px solid currentColor;
      border-radius: 5px;
      display: inline-grid;
      place-items: center;
      margin-right: 9px;
      font-size: 9px;
      font-weight: 800;
    }

    .sidebar-run {
      margin-top: auto;
      padding: 12px 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 7px;
      color: #9ba6b5;
      font-size: 10px;
      line-height: 1.55;
    }

    .sidebar-run strong {
      display: block;
      color: #e5ebf2;
      font-size: 11px;
      margin-bottom: 2px;
    }

    .report-view {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .report-view.active { display: flex; }
    #overviewView { overflow-y: auto; padding-right: 2px; }

    .overview-topbar,
    .detail-topbar { min-height: 48px; margin-bottom: 10px; flex: 0 0 auto; }
    .overview-topbar { align-items: center; }
    .overview-topbar h1,
    .detail-topbar h1 { font-size: 22px; }
    .overview-kicker { margin-bottom: 4px; color: #356f82; font-size: 8px; font-weight: 800; text-transform: uppercase; }

    .overview-summary-line { display: flex; align-items: stretch; border-left: 1px solid var(--line); color: var(--muted); }
    .overview-summary-item { display: grid; min-width: 66px; min-height: 42px; align-content: center; gap: 2px; border-right: 1px solid var(--line); padding: 0 11px; font-size: 8px; }
    .overview-summary-item strong { color: var(--text); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .overview-summary-item:nth-child(4) strong { color: var(--pass); }
    .overview-summary-item:nth-child(5) strong { color: var(--fail); }
    .overview-summary-item:nth-child(6) strong { color: var(--unknown); }
    .overview-summary-item:nth-child(7) strong { color: var(--skip); }

    .overview-execution-toolbar { display: flex; min-height: 55px; align-items: center; justify-content: space-between; gap: 18px; border-block: 1px solid var(--line); padding: 8px 0; flex: 0 0 auto; }
    .execution-toolbar-title { font-size: 13px; font-weight: 800; }
    .execution-toolbar-subtitle { margin-top: 3px; color: var(--muted); font-size: 9px; }
    .execution-toolbar-actions { display: flex; align-items: center; gap: 8px; }
    .execution-search { width: 220px; height: 31px; border: 1px solid var(--line); border-radius: 4px; outline: 0; padding: 0 10px; color: var(--text); background: #ffffff; font-size: 10px; }
    .execution-search:focus { border-color: #82a8b3; box-shadow: 0 0 0 2px rgba(53, 111, 130, 0.1); }
    .execution-collapse-all { min-height: 31px; border: 1px solid var(--line); border-radius: 4px; padding: 0 9px; color: var(--muted); background: #ffffff; font-family: inherit; font-size: 9px; cursor: pointer; }

    .feature-execution-panel { display: flex; flex: 1; min-height: 460px; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: #f8faf8; box-shadow: var(--shadow); }
    .execution-filterbar { display: flex; min-height: 45px; align-items: center; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--line); padding: 0 12px; background: #f8faf8; flex: 0 0 auto; }
    .execution-filter-label { margin-right: 4px; color: var(--muted); font-size: 8px; font-weight: 800; text-transform: uppercase; }
    .execution-status-filter { display: inline-flex; min-height: 26px; align-items: center; gap: 6px; border: 1px solid transparent; border-radius: 3px; padding: 0 8px; color: var(--muted); background: transparent; font-family: inherit; font-size: 8px; white-space: nowrap; cursor: pointer; }

    .feature-tree-row:hover { background: linear-gradient(90deg, color-mix(in srgb, var(--feature-accent) 12%, #f0f5f2), #f0f5f2 42%); }

    .feature-execution-group.collapsed .feature-tree-chevron { transform: rotate(-90deg); }
    .feature-state-badge { position: relative; display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: var(--feature-ring); box-shadow: 0 0 0 1px rgba(31,55,49,.12); }
    .feature-state-badge::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #f9fbf9; }
    .feature-state-badge span { position: relative; z-index: 1; color: #31575d; font-size: 8px; font-weight: 850; }
    .feature-tree-copy { min-width: 0; }
    .feature-tree-name { display: block; overflow: hidden; font-size: 12px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .feature-tree-path { display: block; margin-top: 3px; overflow: hidden; color: var(--muted); font-size: 7px; text-overflow: ellipsis; white-space: nowrap; }
    .feature-result-cell { display: grid; align-content: center; gap: 2px; }
    .feature-result-cell strong { color: var(--text); font-size: 10px; }
    .feature-result-cell small { color: var(--muted); font-size: 7px; }
    .feature-total-duration, .feature-failed-steps { color: var(--muted); font-size: 8px; font-variant-numeric: tabular-nums; }
    .feature-failed-steps strong { color: var(--fail); font-size: 10px; }
    .feature-execution-group.collapsed .scenario-execution-list { display: none; }
    .scenario-execution-list { position: relative; }
    .scenario-execution-list::before { content: ""; position: absolute; z-index: 1; top: 22px; bottom: 22px; left: 19px; width: 1px; background: #cad4cf; }
    .scenario-execution-row { width: 100%; min-height: 64px; border: 0; border-bottom: 1px solid #edf0ee; padding: 0 14px; color: var(--text); background: #ffffff; font-family: inherit; text-align: left; cursor: pointer; }
    .scenario-execution-row:hover { background: #f4f8f6; }
    .scenario-execution-row.active { background: #edf5f2; box-shadow: inset 3px 0 0 #356f82; }
    .scenario-status-mark { position: relative; z-index: 2; width: 10px; height: 10px; border: 2px solid #ffffff; border-radius: 2px; background: var(--execution-color); box-shadow: 0 0 0 1px #aebdb7; }
    .scenario-execution-code { color: #356f82; font-size: 9px; font-weight: 800; }
    .scenario-execution-type { display: block; margin-top: 3px; color: var(--muted); font-size: 7px; font-weight: 500; text-transform: uppercase; }
    .scenario-execution-name { display: -webkit-box; overflow: hidden; font-size: 11px; font-weight: 750; line-height: 1.35; line-clamp: 2; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .scenario-result-label { display: inline-flex; width: fit-content; min-height: 23px; align-items: center; border-radius: 3px; padding: 0 7px; color: var(--execution-color); background: color-mix(in srgb, var(--execution-color) 11%, white); font-size: 8px; font-weight: 800; }
    .scenario-duration, .scenario-failed-steps { color: var(--muted); font-size: 8px; font-variant-numeric: tabular-nums; }
    .scenario-failed-steps strong { color: var(--fail); font-size: 9px; }
    .execution-row-arrow { color: #9aa5a6; font-size: 13px; text-align: right; }
    .execution-footer { display: flex; min-height: 32px; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding: 0 12px; color: var(--muted); background: #f8faf8; font-size: 8px; }
    .execution-legend { display: flex; gap: 12px; }
    .execution-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .execution-legend i { width: 7px; height: 7px; border-radius: 2px; background: var(--execution-color); }
    .execution-tooltip { position: fixed; z-index: 40; display: none; max-width: 360px; border: 1px solid #c9d1cd; border-radius: 4px; padding: 8px 9px; color: var(--text); background: rgba(255,255,255,.98); box-shadow: 0 10px 28px rgba(24,45,39,.14); font-size: 9px; line-height: 1.5; pointer-events: none; }
    .execution-empty { display: grid; min-height: 240px; place-items: center; color: var(--muted); font-size: 10px; }

    .detail-workspace {
      display: grid;
      grid-template-columns: minmax(280px, 0.72fr) minmax(520px, 1.7fr);
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    .detail-workspace > .panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    .detail-workspace > .panel > .panel-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .detail-workspace .scenario-list,
    #detailBody { overflow: auto; }

    .detail-heading { display: flex; align-items: flex-start; gap: 12px; }
    .detail-heading h1 { margin-bottom: 3px; }
    .detail-feature-select { width: min(300px, 34vw); height: 34px; border: 1px solid var(--line); border-radius: 5px; outline: 0; padding: 0 30px 0 9px; color: var(--text); background: #ffffff; font-family: inherit; font-size: 11px; }
    .detail-feature-select:focus { border-color: #82a8b3; box-shadow: 0 0 0 2px rgba(53, 111, 130, 0.1); }
    .scenario-panel-actions { display: flex; align-items: center; gap: 7px; }
    .scenario-drawer-toggle { display: none; min-height: 28px; border: 1px solid var(--line); border-radius: 4px; padding: 0 8px; color: var(--text); background: #ffffff; font-family: inherit; font-size: 10px; cursor: pointer; }

    .scenario-list { gap: 0; padding-right: 0; }
    .scenario-card { min-height: 46px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 10px; }
    .scenario-card:hover { border-color: var(--line); background: #f6f9f7; }
    .scenario-card.active { border-color: var(--line); background: #eef5f3; box-shadow: inset 3px 0 0 #356f82; }
    .scenario-card.active::after { display: none; }
    .scenario-card.outline-row { border-left: 0; background: #f7f9f8; box-shadow: none; }
    .scenario-card.example-row { margin-left: 20px; border-color: var(--line); background: #fcfdfc; }
    .scenario-card.example-row::before { left: -12px; width: 12px; border-color: #c9d1cd; }
    .scenario-head { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 8px; margin-bottom: 0; }
    .scenario-code { color: #356f82; font-size: 9px; font-weight: 850; font-variant-numeric: tabular-nums; }
    .scenario-copy { min-width: 0; }
    .scenario-name { overflow: hidden; font-size: 12px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .scenario-subline { margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 9px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .scenario-path { overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .scenario-type { height: 18px; border-radius: 3px; padding: 0 5px; font-size: 9px; }
    .scenario-tags { margin-top: 5px; }
    .tag, .param-chip { border-radius: 3px; font-size: 9px; }
    .scenario-error { margin-top: 4px; border-left: 0; border-radius: 3px; padding: 0 0 0 46px; background: transparent; font-size: 9px; line-clamp: 1; -webkit-line-clamp: 1; }

    .step-list { position: relative; gap: 0; margin: 16px 0 0 12px; border-left: 1px solid #c9d1cd; }
    .step { position: relative; margin-left: 15px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; overflow: visible; }
    .step:last-child { border-bottom: 0; }
    .step::before { content: ""; position: absolute; z-index: 2; top: 17px; left: -20px; width: 8px; height: 8px; border: 2px solid #ffffff; border-radius: 2px; background: var(--unknown); box-shadow: 0 0 0 1px #c9d1cd; }
    .step.passed::before { background: var(--pass); }
    .step.failed::before { background: var(--fail); }
    .step.skipped::before { background: var(--skip); }
    .step-main { grid-template-columns: 24px 1fr auto; min-height: 43px; gap: 9px; padding: 8px 9px; }
    .step-index { width: 20px; height: 20px; border-radius: 3px; font-size: 9px; }
    .bdd-keyword { min-width: 42px; height: 18px; justify-content: center; border-radius: 3px; padding: 0 5px; font-size: 9px; }
    .step-name { font-size: 12px; }
    .step-meta { margin-top: 2px; font-size: 10px; }
    .step-extra { border-top: 1px solid var(--line); padding: 10px; background: #f9faf9; }
    .step-extra .facts { margin: 0 0 10px; }

    .scenario-evidence-summary { margin: 12px 0; border-left: 3px solid var(--fail); padding: 9px 11px; color: #8f2f2f; background: #fff5f5; font-size: 11px; line-height: 1.45; }
    .evidence-section { margin: 14px 0; border-block: 1px solid var(--line); padding: 11px 0 12px; }
    .evidence-section-title { color: var(--text); font-size: 11px; font-weight: 800; }
    .evidence-section-note { margin-top: 3px; color: var(--muted); font-size: 9px; }
    .evidence-section .attachment-grid { margin-top: 9px; }

    .detail-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .detail-panel-heading,
    .detail-panel-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .detail-position {
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .detail-nav-button {
      display: inline-grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--text);
      background: #ffffff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .detail-nav-button.attention {
      width: auto;
      padding: 0 8px;
      color: var(--fail);
      font-size: 10px;
    }

    .detail-nav-button:disabled {
      cursor: default;
      opacity: 0.42;
    }

    .back-button {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 11px;
      color: var(--text);
      background: #ffffff;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    @media (max-width: 1100px) {
      .shell { grid-template-columns: 72px 1fr; }
      .sidebar { padding: 16px 9px; }
      .brand { justify-content: center; padding: 0 0 14px; }
      .brand > div:last-child,
      .nav-section,
      button.nav-item > span:not(.nav-symbol),
      .sidebar-run { display: none; }
      button.nav-item { justify-content: center; padding: 8px 0; }
      .nav-symbol { margin-right: 0; }
      .detail-workspace { grid-template-columns: minmax(250px, 0.65fr) minmax(420px, 1.35fr); }
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .topbar { flex-direction: column; }
      .toolbar { justify-content: flex-start; }
      .search { min-width: min(100%, 320px); }
    }

    @media (max-width: 760px) {
      html,
      body { height: auto; overflow: auto; }
      .shell { display: block; height: auto; }
      .sidebar { position: static; height: auto; flex-direction: row; align-items: center; gap: 5px; padding: 8px 12px; }
      .sidebar .brand { border: 0; margin: 0 auto 0 0; padding: 0; }
      .sidebar .brand-mark { width: 30px; height: 30px; }
      button.nav-item > span:not(.nav-symbol) { display: inline; }
      button.nav-item { gap: 7px; padding: 8px 9px; }
      .content { height: auto; min-height: calc(100vh - 46px); overflow: visible; }
      .report-view { overflow: visible; }
      .detail-workspace { grid-template-columns: 1fr; }
      .overview-summary-line { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding-block: 6px; }
      .overview-summary-item { display: grid; min-height: 42px; place-content: center; gap: 1px; padding: 3px 5px; text-align: center; }
      .overview-summary-item:first-child { padding-left: 5px; }
      .overview-summary-item:nth-child(4),
      .overview-summary-item:nth-child(7) { border-left: 0; }
      .overview-summary-item strong { font-size: 14px; }
      .overview-topbar { align-items: stretch; }
      .overview-summary-line { overflow-x: auto; }
      .overview-execution-toolbar { align-items: flex-start; flex-direction: column; }
      .execution-toolbar-actions { width: 100%; overflow-x: auto; }
      .feature-execution-tree { min-width: 870px; }
      .detail-topbar { gap: 10px; }
      .detail-heading { width: 100%; }
      .detail-actions { width: 100%; justify-content: flex-start; }
      .detail-feature-select { width: 100%; max-width: none; }
      #scenarioPanel { min-height: 0; height: auto; }
      #scenarioPanel > .panel-body { display: none; max-height: 360px; }

      .scenario-drawer-toggle { display: inline-flex; align-items: center; }
      #detailPanel .panel-header { align-items: flex-start; flex-direction: column; }
      .detail-panel-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
      #detailPanel { min-height: 520px; }
      .content { padding: 16px; }
      .facts { grid-template-columns: 1fr 1fr; }
      .step-main { grid-template-columns: 26px 1fr; }
      .step-main .status-pill { grid-column: 2; width: fit-content; }

</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">BA</div>
        <div>
          <div class="brand-title">BDD Autowork</div>
          <div class="brand-subtitle">执行报告</div>
        </div>
      </div>
      <div class="nav-section">报告</div>
      <button class="nav-item active" data-view-target="overview"><span class="nav-symbol">01</span><span>执行场景</span></button>
      <button class="nav-item" data-view-target="details"><span class="nav-symbol">02</span><span>测试详情</span></button>
      <div class="sidebar-run">
        <strong id="sidebarProject">BDD Autowork</strong>
        <span id="sidebarRunMeta">本地执行报告</span>
      </div>
    </aside>

    <main class="content">
      <section class="report-view active" id="overviewView" data-view="overview">
        <div class="topbar overview-topbar">
          <div>
            <div class="overview-kicker">BDD Autowork / Run Report</div>
            <h1 id="reportTitle">Feature 分组执行表</h1>
            <div class="meta" id="reportMeta"></div>
          </div>
          <section class="overview-summary-line" id="overviewSummaryLine"></section>
        </div>

        <div class="overview-execution-toolbar">
          <div>
            <div class="execution-toolbar-title">本次验收场景</div>
            <div class="execution-toolbar-subtitle" id="executionSortDescription">Feature 内保持 Gherkin 规格顺序</div>
          </div>
          <div class="execution-toolbar-actions">
            <input class="execution-search" id="executionSearchInput" type="search" placeholder="搜索 Feature、场景或 tag" aria-label="搜索 Feature、场景或 tag" />
            <div class="segmented" id="featureSortControl" aria-label="Feature 排序">
              <button class="active" data-feature-sort="original" aria-pressed="true">规格顺序</button>
              <button data-feature-sort="attention" aria-pressed="false">需跟进优先</button>
              <button data-feature-sort="duration" aria-pressed="false">最慢优先</button>
            </div>
            <button class="execution-collapse-all" id="executionCollapseAll" aria-expanded="false">全部展开</button>
          </div>
        </div>

        <section class="feature-execution-panel">
          <div class="execution-filterbar" id="executionStatusFilters"></div>
          <div class="execution-scroller" id="executionScroll">
            <div class="feature-execution-tree" id="featureExecutionTree">
              <div class="execution-column-header"><span>状态</span><span>编号 / 类型</span><span>名称</span><span>执行结果</span><span>耗时</span><span>失败 Step</span><span>详情</span></div>
              <div id="featureGroups"></div>
            </div>
          </div>
          <div class="execution-footer">
            <div class="execution-legend">
              <span><i style="--execution-color:var(--pass)"></i>通过</span>
              <span><i style="--execution-color:var(--fail)"></i>需跟进</span>
              <span><i style="--execution-color:var(--skip)"></i>未执行</span>
              <span><i style="--execution-color:var(--unknown)"></i>状态未知</span>
            </div>
            <span id="executionVisibleSummary"></span>
          </div>
        </section>
        <div class="execution-tooltip" id="executionTooltip"></div>
      </section>

      <section class="report-view" id="detailView" data-view="details">
        <div class="topbar detail-topbar">
          <div class="detail-heading">
            <button class="back-button" data-view-target="overview">← 返回执行场景</button>
            <div>
              <h1>测试执行详情</h1>
              <div class="meta" id="detailBreadcrumb">Feature → Scenario / Example → Step</div>
            </div>
          </div>
          <div class="detail-actions">
            <select class="detail-feature-select" id="detailFeatureSelect" aria-label="选择 Feature"></select>
            <input class="search" id="searchInput" placeholder="搜索 scenario / tag / step / locator" />
            <div class="segmented" aria-label="状态筛选">
              <button class="active" data-filter="all">全部</button>
              <button data-filter="failed">需跟进</button>
              <button data-filter="passed">通过</button>
              <button data-filter="skipped">未执行</button>
              <button data-filter="unknown">状态未知</button>
            </div>
          </div>
        </div>

        <section class="detail-workspace">
          <div class="panel" id="scenarioPanel">
            <div class="panel-header">
              <div class="panel-title" id="scenarioPanelTitle">Scenario / Examples</div>
              <div class="scenario-panel-actions"><span class="status-pill status-unknown" id="visibleCount">0</span><button class="scenario-drawer-toggle" id="scenarioDrawerToggle" aria-expanded="false">展开</button></div>
            </div>
            <div class="panel-body"><div class="scenario-list" id="scenarioList"></div></div>
          </div>

          <div class="panel" id="detailPanel">
          <div class="panel-header">

          </div>

          </div>
        </div>
        </section>
      </section>
    </main>
  </div>

  <script>
    // 生成器只需要替换 reportData。结构面向 BDD：Feature -> Scenario/Outline Example -> Step。
    const reportData = {
      title: "桌面自动化回归测试",

      features: [
        {

              steps: [
                {
                  keyword: "Given",

                  ]
