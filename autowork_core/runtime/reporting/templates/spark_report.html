    const state = {
      view: "overview",
      filter: "all",
      search: "",
      featureSearch: "",
      featureSort: "original",
      executionStatus: "all",
      executionSearch: "",
      executionScrollLeft: 0,
      executionScrollTop: 0,
      collapsedFeatures: new Set((reportData.features || []).map((_, index) => index)),
      selectedFeatureId: null,
      selectedId: null,
      lastRenderedDetailId: null,
      scenarioScrollTop: 0,
      focusScenarioAfterRender: false,
      scenarioDrawerOpen: false,
      expandedOutlines: new Set()
    };

    function normalizeStatus(status) {
      const text = String(status || "unknown").toLowerCase();
      if (text.includes("fail") || text.includes("error") || text.includes("undefined")) return "failed";
      if (text.includes("skip") || text.includes("untested")) return "skipped";
      if (text.includes("pass")) return "passed";
      return "unknown";
    }

    function aggregateStatus(items) {
      const statuses = items.map(item => normalizeStatus(item.status));
      if (statuses.includes("failed")) return "failed";
      if (statuses.length && statuses.every(status => status === "skipped")) return "skipped";
      if (statuses.length && statuses.every(status => status === "passed")) return "passed";
      return "unknown";
    }

    function statusLabel(status) {
      const normalized = normalizeStatus(status);
      return ({ passed: "通过", failed: "需跟进", skipped: "未执行", unknown: "状态未知" })[normalized] || "状态未知";
    }

    function statusPill(status) {
      const normalized = normalizeStatus(status);
      const cls = normalized === "passed" ? "status-pass" : normalized === "failed" ? "status-fail" : normalized === "skipped" ? "status-skip" : "status-unknown";
      return `<span class="status-pill ${cls}">${statusLabel(status)}</span>`;
    }

    function stepStats(steps) {
      const list = steps || [];
      return {
        failedSteps: list.filter(step => normalizeStatus(step.status) === "failed").length,
        attachmentCount: list.reduce((sum, step) => sum + ((step.attachments || []).length), 0)
      };
    }

    function scenarioAttachmentCount(item) {
      return (item.attachments || []).length;
    }

    function firstError(steps) {
      const failed = (steps || []).find(step => normalizeStatus(step.status) === "failed" && step.error);
      return failed ? failed.error : "";
    }

    function outlineFirstError(outline) {
      for (const example of outline.examples || []) {
        const error = firstError(example.steps || []);
        if (error) return error;
      }
      return "";
    }

    function outlineStats(outline) {
      const examples = outline.examples || [];
      return examples.reduce((acc, example) => {
        const stats = stepStats(example.steps);
        acc.failedSteps += stats.failedSteps;
        acc.attachmentCount += stats.attachmentCount + scenarioAttachmentCount(example);
        return acc;
      }, { failedSteps: 0, attachmentCount: 0 });
    }

    function featureRows(feature, featureIndex) {
      const rows = [];
      if (feature.skipScope === "feature" && normalizeStatus(feature.status) === "skipped") {
        rows.push({
          ...feature,
          id: `${featureIndex}-feature-skip`,
          rowType: "feature-skip",
          feature: feature.name,
          featureId: String(featureIndex),
          file: feature.file,
          duration: "-",
          failedSteps: 0,
          attachmentCount: 0,
          steps: [],
        });
        return rows;
      }
      (feature.scenarios || []).forEach((scenario, scenarioIndex) => {
        if (scenario.type === "outline") {
          const examples = scenario.examples || [];
          const stats = outlineStats(scenario);
          const outlineId = `${featureIndex}-${scenarioIndex}`;
          rows.push({
            ...scenario,
            id: outlineId,
            rowType: "outline",
            status: aggregateStatus(examples),
            feature: feature.name,
            featureId: String(featureIndex),
            file: feature.file,
            failedSteps: stats.failedSteps,
            attachmentCount: stats.attachmentCount,
            error: outlineFirstError(scenario)
          });
          examples.forEach((example, exampleIndex) => {
            const exampleStats = stepStats(example.steps);
            rows.push({
              ...example,
              id: `${featureIndex}-${scenarioIndex}-${exampleIndex}`,
              parentId: outlineId,
              rowType: "example",
              parentName: scenario.name,
              tags: scenario.tags || [],
              owner: scenario.owner,
              feature: feature.name,
              featureId: String(featureIndex),
              file: feature.file,
              failedSteps: exampleStats.failedSteps,
              attachmentCount: exampleStats.attachmentCount + scenarioAttachmentCount(example),
              error: firstError(example.steps || [])
            });
          });
          return;
        }

        const stats = stepStats(scenario.steps);
        rows.push({
          ...scenario,
          id: `${featureIndex}-${scenarioIndex}`,
          rowType: "scenario",
          feature: feature.name,
          featureId: String(featureIndex),
          file: feature.file,
          failedSteps: stats.failedSteps,
          attachmentCount: stats.attachmentCount + scenarioAttachmentCount(scenario),
          error: firstError(scenario.steps || [])
        });
      });
      return rows;
    }

    function flattenRows() {
      return reportData.features.flatMap((feature, index) => featureRows(feature, index));
    }

    function executableRows(rows) {
      return rows.filter(row => row.rowType !== "outline" && row.rowType !== "feature-skip");
    }

    function computeSummary(rows, featureScope = reportData.features || []) {
      const executable = executableRows(rows);
      const passed = executable.filter(row => normalizeStatus(row.status) === "passed").length;
      const failed = executable.filter(row => normalizeStatus(row.status) === "failed").length;
      const unknown = executable.filter(row => normalizeStatus(row.status) === "unknown").length;
      const skippedScenarios = executable.filter(row => normalizeStatus(row.status) === "skipped").length;
      const skippedFeatures = featureScope.filter(feature => feature.skipScope === "feature" && normalizeStatus(feature.status) === "skipped").length;
      const skippedFeatureUnits = featureScope.filter(feature => feature.skipScope === "feature").reduce((sum, feature) => sum + Number(feature.plannedUnits || 0), 0);
      const executionRange = passed + failed + unknown;
      const unexecutedScenarios = skippedScenarios + skippedFeatureUnits;
      const plannedRange = executionRange + unexecutedScenarios;
      const attachments = executable.reduce((sum, row) => sum + row.attachmentCount, 0);
      return {
        total: executionRange,
        executionRange,
        plannedRange,
        passed,
        failed,
        skipped: skippedScenarios + skippedFeatures,
        skippedScenarios,
        skippedFeatures,
        skippedFeatureUnits,
        unexecutedScenarios,
        unknown,
        attachments,
        passRate: executionRange ? Math.round(passed / executionRange * 1000) / 10 : 0
      };
    }

    function computeFeatureSummary(feature, featureIndex) {
      return computeSummary(featureRows(feature, featureIndex), [feature]);
    }

    function featureMatchesSearch(feature) {
      if (!state.featureSearch) return true;
      const haystack = `${feature.name || ""} ${feature.file || ""} ${(feature.tags || []).join(" ")}`.toLowerCase();
      return haystack.includes(state.featureSearch.toLowerCase());
    }

    function featureHasStatus(feature, index, status) {
      return featureRows(feature, index).some(row => row.rowType !== "outline" && normalizeStatus(row.status) === status);
    }

    function featureMatchesStatus(feature, index) {
      return state.filter === "all" || featureHasStatus(feature, index, state.filter);
    }

    function visibleFeatureEntries() {
      return (reportData.features || [])
        .map((feature, index) => ({ feature, index }))
        .filter(({ feature, index }) => featureMatchesSearch(feature) && featureMatchesStatus(feature, index));
    }

    function selectedFeature() {
      const features = reportData.features || [];
      if (!features.length) return null;
      const visible = visibleFeatureEntries();
      if (!visible.length) return null;
      if (!visible.some(({ index }) => String(index) === state.selectedFeatureId)) state.selectedFeatureId = String(visible[0].index);
      return features[Number(state.selectedFeatureId)];
    }

    function matchesFilter(row) {
      if (state.filter !== "all" && normalizeStatus(row.status) !== state.filter) return false;
      if (!state.search) return true;
      const params = row.params ? Object.entries(row.params).map(([key, value]) => `${key}=${value}`).join(" ") : "";
      const actionText = (row.steps || []).flatMap(step => step.actions || []).map(action => `${action.name || ""} ${action.target || ""} ${action.value || ""} ${action.root || ""}`).join(" ");
      const haystack = [row.feature, row.parentName, row.name, row.file, row.owner, params, ...(row.tags || []), ...(row.steps || []).map(step => `${step.keyword || ""} ${step.name || ""}`), actionText].join(" ").toLowerCase();
      return haystack.includes(state.search.toLowerCase());
    }

    function isOutlineExpanded(row) {
      return state.expandedOutlines.has(row.id);
    }

    function shouldShowRow(row) {
      if (row.rowType !== "example") return true;
      if (state.search || state.filter !== "all") return true;
      return state.expandedOutlines.has(row.parentId);
    }

    function toggleOutline(row) {
      if (state.expandedOutlines.has(row.id)) {
        state.expandedOutlines.delete(row.id);
        if (state.selectedId && state.selectedId.startsWith(`${row.id}-`)) {
          state.selectedId = row.id;
        }
      } else {
        state.expandedOutlines.add(row.id);
      }
    }

    function scenarioNavigationCode(row) {
      const parts = String(row.id || "").split("-").map(part => Number(part));
      if (row.rowType === "feature-skip") return "Feature";
      if (row.rowType === "example") return row.exampleId || `E${String((parts[2] || 0) + 1).padStart(2, "0")}`;
      if (row.rowType === "outline") return `O${String((parts[1] || 0) + 1).padStart(2, "0")}`;
      return `S${String((parts[1] || 0) + 1).padStart(2, "0")}`;
    }

    function scenarioTypeLabel(row) {
      return row.rowType === "outline" ? "Scenario Outline" : row.rowType === "example" ? "Example" : row.rowType === "feature-skip" ? "Feature" : "Scenario";
    }

    function scenarioNavigationMeta(row) {
      const meta = [];
      if (row.duration && row.duration !== "-") meta.push(row.duration);
      if (row.rowType === "outline") meta.push(`${(row.examples || []).length} Examples`);
      if (row.rowType === "example" && row.params) {
        meta.push(Object.entries(row.params).map(([key, value]) => `${key}=${value}`).join(" · "));
      }
      if (row.attachmentCount) meta.push(`${row.attachmentCount} 附件`);
      return meta.join(" · ");
    }

    function renderFeatureSelect() {
      const features = reportData.features || [];
      const visibleFeatures = visibleFeatureEntries();
      if (!visibleFeatures.some(({ index }) => String(index) === state.selectedFeatureId)) {
        state.selectedFeatureId = visibleFeatures.length ? String(visibleFeatures[0].index) : null;
        state.selectedId = null;
      }
      const select = document.getElementById("detailFeatureSelect");
      select.innerHTML = visibleFeatures.map(({ feature, index }) => {
        const summary = computeFeatureSummary(feature, index);
        const result = [
          summary.failed ? `${summary.failed} 需跟进` : "",
          summary.unknown ? `${summary.unknown} 状态未知` : "",
        ].filter(Boolean).join(" · ") || "无异常";
        return `<option value="${index}">F${String(index + 1).padStart(2, "0")} · ${escapeHtml(feature.name)} · ${result}</option>`;
      }).join("");
      select.disabled = !visibleFeatures.length;
      if (state.selectedFeatureId !== null) select.value = state.selectedFeatureId;
      const selected = features[Number(state.selectedFeatureId)];
      document.getElementById("detailBreadcrumb").textContent = selected
        ? `${selected.name} → Scenario / Example → Step 与证据`
        : "Scenario / Example → Step 与证据";
    }

    function renderSummaryLine(summary) {
      const features = (reportData.features || []).length;
      document.getElementById("overviewSummaryLine").innerHTML = [
        ["Feature", features],
        ["测试场景", summary.plannedRange],
        ["已执行", summary.executionRange],
        ["符合预期", summary.passed],
        ["需跟进", summary.failed],
        ["状态未知", summary.unknown],
        ["未执行", summary.unexecutedScenarios],
        ["通过率", `${summary.passRate}%`],
        ["总耗时", reportData.duration || "-"]
      ].map(([label, value]) => `<span class="overview-summary-item">${escapeHtml(label)}<strong>${escapeHtml(value)}</strong></span>`).join("");
    }

    function durationSeconds(value) {
      const parts = String(value || "").split(":").map(Number);
      if (!parts.length || parts.some(part => !Number.isFinite(part))) return 0;
      return parts.reduce((total, part) => total * 60 + part, 0);
    }

    function formatExecutionDuration(seconds) {
      if (!seconds) return "—";
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor(seconds % 3600 / 60);
      const remainder = seconds % 60;
      return hours
        ? `${hours}:${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`
        : `${minutes}:${String(remainder).padStart(2, "0")}`;
    }

    function executionColor(status) {
      return ({ passed: "var(--pass)", failed: "var(--fail)", skipped: "var(--skip)", unknown: "var(--unknown)" })[normalizeStatus(status)];
    }

    function executionRowsForFeature(feature, featureIndex) {
      const rows = featureRows(feature, featureIndex);
      return rows.filter(row => row.rowType !== "outline").map((row, index) => ({
        ...row,
        executionName: row.rowType === "feature-skip"
          ? `整项 Feature 未执行 · 计划 ${Number(feature.plannedUnits || 0)} 个场景 · ${feature.skipReason || "skipped"}`
          : row.name,
        executionPosition: index + 1,
        executionUnits: row.rowType === "feature-skip" ? Math.max(1, Number(feature.plannedUnits || 0)) : 1,
      }));
    }

    function executionCounts(items) {
      return items.reduce((result, item) => {
        result[normalizeStatus(item.status)] += item.executionUnits;
        return result;
      }, { passed: 0, failed: 0, skipped: 0, unknown: 0 });
    }

    function executionItemMatches(item, feature) {
      if (!state.executionSearch) return true;
      const params = item.params ? Object.entries(item.params).map(([key, value]) => `${key}=${value}`).join(" ") : "";
      const haystack = [feature.name, feature.file, item.executionName, item.parentName, item.exampleId, params, ...(item.tags || [])].join(" ").toLowerCase();
      return haystack.includes(state.executionSearch.toLowerCase());
    }

    function visibleExecutionItems(feature, featureIndex) {
      return executionRowsForFeature(feature, featureIndex).filter(item =>
        (state.executionStatus === "all" || normalizeStatus(item.status) === state.executionStatus)
        && executionItemMatches(item, feature)
      );
    }

    function executionFilterActive() {
      return Boolean(state.executionSearch) || state.executionStatus !== "all";
    }

    function featureExecutionStats(feature, featureIndex) {
      const items = executionRowsForFeature(feature, featureIndex);
      const counts = executionCounts(items);
      const executed = counts.passed + counts.failed + counts.unknown;
      const planned = counts.passed + counts.failed + counts.skipped + counts.unknown;
      const totalDuration = items.reduce((sum, item) => sum + durationSeconds(item.duration), 0);
      const failedSteps = items.reduce((sum, item) => sum + Number(item.failedSteps || 0), 0);
      const passRate = executed ? Math.round(counts.passed / executed * 100) : null;
      return { items, counts, executed, planned, totalDuration, failedSteps, passRate };
    }

    function orderedFeatureEntries() {
      const entries = (reportData.features || []).map((feature, featureIndex) => ({
        feature,
        featureIndex,
        visibleItems: visibleExecutionItems(feature, featureIndex),
        stats: featureExecutionStats(feature, featureIndex),
      })).filter(entry => entry.visibleItems.length);
      if (state.featureSort === "attention") {
        entries.sort((left, right) => right.stats.counts.failed - left.stats.counts.failed || right.stats.counts.unknown - left.stats.counts.unknown || left.featureIndex - right.featureIndex);
      } else if (state.featureSort === "duration") {
        entries.sort((left, right) => right.stats.totalDuration - left.stats.totalDuration || left.featureIndex - right.featureIndex);
      }
      return entries;
    }

    function featureStateRing(stats) {
      const total = Math.max(stats.planned, 1);
      let cursor = 0;
      const segments = ["passed", "failed", "skipped", "unknown"].filter(status => stats.counts[status]).map(status => {
        const start = cursor / total * 100;
        cursor += stats.counts[status];
        return `${executionColor(status)} ${start}% ${cursor / total * 100}%`;
      });
      return `conic-gradient(${segments.join(", ") || "#d6ddda 0 100%"})`;
    }

    function renderExecutionFilters(summary) {
      const filters = [
        ["all", "全部", summary.plannedRange, "#5f7076"],
        ["failed", "需跟进", summary.failed, "var(--fail)"],
        ["skipped", "未执行", summary.unexecutedScenarios, "var(--skip)"],
        ["unknown", "状态未知", summary.unknown, "var(--unknown)"],
        ["passed", "通过", summary.passed, "var(--pass)"],
      ];
      document.getElementById("executionStatusFilters").innerHTML = `<span class="execution-filter-label">筛选</span>${filters.map(([status, label, count, color]) => `<button class="execution-status-filter ${state.executionStatus === status ? "active" : ""}" data-execution-status="${status}" aria-pressed="${state.executionStatus === status}" style="--execution-color:${color}">${label} ${count}</button>`).join("")}<span class="execution-filter-spacer"></span><span class="execution-unit-note">Feature 内始终保持 Gherkin 规格顺序</span>`;
    }

    function executionCode(item) {
      if (item.rowType === "feature-skip") return "Feature";
      if (item.rowType === "example") return item.exampleId || `E${item.executionPosition}`;
      return `S${String(item.executionPosition).padStart(2, "0")}`;
    }

    function renderScenarioExecutionRow(item, featureIndex) {
      const status = normalizeStatus(item.status);
      const type = item.rowType === "example" ? "Example" : item.rowType === "feature-skip" ? "Feature" : "Scenario";
      const failedSteps = item.rowType === "feature-skip" ? `${item.executionUnits} 计划场景` : item.failedSteps ? `<strong>${item.failedSteps}</strong> 个` : "—";
      return `<button class="scenario-execution-row ${item.id === state.selectedId ? "active" : ""}" data-execution-row-id="${escapeAttr(item.id)}" data-execution-feature-id="${featureIndex}" data-execution-name="${escapeAttr(item.executionName)}" data-execution-status="${escapeAttr(status)}" data-execution-duration="${escapeAttr(item.duration || "-")}" style="--execution-color:${executionColor(status)}" aria-label="${escapeAttr(`${item.executionName}，${statusLabel(status)}，${item.duration || "-"}`)}"><span class="scenario-status-mark"></span><span class="scenario-execution-code">${escapeHtml(executionCode(item))}<small class="scenario-execution-type">${type}</small></span><span class="scenario-execution-name" title="${escapeAttr(item.executionName)}">${escapeHtml(item.executionName)}</span><span class="scenario-result-label">${statusLabel(status)}</span><span class="scenario-duration">${escapeHtml(item.duration || "-")}</span><span class="scenario-failed-steps">${failedSteps}</span><span class="execution-row-arrow">›</span></button>`;
    }

    function renderGroupedExecution(rows, summary) {
      renderExecutionFilters(summary);
      const entries = orderedFeatureEntries();
      const filtersActive = executionFilterActive();
      const groups = entries.map(({ feature, featureIndex, visibleItems, stats }) => {
        const collapsed = state.collapsedFeatures.has(featureIndex) && !filtersActive;
        const featureAccent = stats.counts.failed ? "var(--fail)" : stats.counts.unknown ? "var(--unknown)" : stats.passRate === null ? "var(--skip)" : "var(--pass)";
        const resultRatio = stats.executed ? `${stats.counts.passed}/${stats.executed}` : "—";
        const resultLabel = stats.passRate === null ? `${stats.planned} 未执行` : `${stats.passRate}% 通过`;
        const failedSteps = stats.failedSteps ? `<strong>${stats.failedSteps}</strong> 个` : "—";
        return `<section class="feature-execution-group ${collapsed ? "collapsed" : ""}" data-feature-group-id="${featureIndex}" style="--feature-accent:${featureAccent};--feature-ring:${featureStateRing(stats)}"><button class="feature-tree-row" data-toggle-feature="${featureIndex}" aria-expanded="${!collapsed}" aria-disabled="${filtersActive}"><span class="feature-primary-status"></span><span class="feature-tree-code"><span class="feature-tree-chevron">▼</span><span class="feature-state-badge"><span>F${String(featureIndex + 1).padStart(2, "0")}</span></span></span><span class="feature-tree-copy"><strong class="feature-tree-name">${escapeHtml(feature.name)}</strong><small class="feature-tree-path">${escapeHtml(feature.file || "")} · ${stats.planned} 场景</small></span><span class="feature-result-cell"><strong>${resultRatio}</strong><small>${resultLabel}</small></span><span class="feature-total-duration">${formatExecutionDuration(stats.totalDuration)}</span><span class="feature-failed-steps">${failedSteps}</span><span class="execution-row-arrow">›</span></button><div class="scenario-execution-list">${visibleItems.map(item => renderScenarioExecutionRow(item, featureIndex)).join("")}</div></section>`;
      }).join("");
      document.getElementById("featureGroups").innerHTML = groups || `<div class="execution-empty">没有匹配的 Feature 或 Scenario</div>`;
      const visibleUnits = entries.reduce((total, entry) => total + entry.visibleItems.reduce((sum, item) => sum + item.executionUnits, 0), 0);
      document.getElementById("executionVisibleSummary").textContent = `${entries.length} Feature · ${visibleUnits} 测试场景`;
      const allCollapsed = entries.length > 0 && entries.every(entry => state.collapsedFeatures.has(entry.featureIndex));
      const collapseButton = document.getElementById("executionCollapseAll");
      collapseButton.disabled = filtersActive;
      collapseButton.setAttribute("aria-expanded", String(filtersActive || !allCollapsed));
      collapseButton.textContent = filtersActive ? "筛选结果已展开" : allCollapsed ? "全部展开" : "全部收起";
      requestAnimationFrame(() => {
        const scroller = document.getElementById("executionScroll");
        scroller.scrollLeft = state.executionScrollLeft;
        scroller.scrollTop = state.executionScrollTop;
      });
    }

    function renderOverview(rows, summary) {
      renderSummaryLine(summary);
      renderGroupedExecution(rows, summary);
    }

    function setView(view) {
      state.view = view === "details" ? "details" : "overview";
      document.querySelectorAll("[data-view]").forEach(item => item.classList.toggle("active", item.dataset.view === state.view));
      document.querySelectorAll(".sidebar [data-view-target]").forEach(item => item.classList.toggle("active", item.dataset.viewTarget === state.view));
    }

    function firstFeatureWithStatus(status) {
      const features = reportData.features || [];
      return features.findIndex((feature, index) => featureHasStatus(feature, index, status));
    }

    function openDetails({ featureId = null, rowId = null, filter = null } = {}) {
      if (featureId !== null) state.selectedFeatureId = String(featureId);
      if (rowId !== null) {
        if (filter === null) state.filter = "all";
        state.selectedId = String(rowId);
        const parts = String(rowId).split("-");
        state.selectedFeatureId = parts[0];
        if (parts.length === 3) state.expandedOutlines.add(parts.slice(0, 2).join("-"));
      }
      if (filter !== null) {
        state.filter = filter;
        if (featureId === null && rowId === null && filter !== "all") {
          const matchingFeature = firstFeatureWithStatus(filter);
          if (matchingFeature >= 0) state.selectedFeatureId = String(matchingFeature);
        }
      }
      state.search = "";
      state.featureSearch = "";
      state.scenarioScrollTop = 0;
      document.getElementById("searchInput").value = "";
      state.scenarioDrawerOpen = false;
      setView("details");
      render();
    }

    function restoreScenarioListScroll() {
      const list = document.getElementById("scenarioList");
      const active = list.querySelector(".scenario-card.active");
      list.scrollTop = state.scenarioScrollTop;
      if (!active) {
        state.focusScenarioAfterRender = false;
        return;
      }
      const listRect = list.getBoundingClientRect();
      const activeRect = active.getBoundingClientRect();
      if (activeRect.top < listRect.top || activeRect.bottom > listRect.bottom) {
        active.scrollIntoView({ block: "nearest" });
      }
      if (state.focusScenarioAfterRender) {
        try {
          active.focus({ preventScroll: true });
        } catch (error) {
          active.focus();
        }
        state.focusScenarioAfterRender = false;
      }
    }

    function renderList(rows) {
      const feature = selectedFeature();
      const featureIndex = Number(state.selectedFeatureId || 0);
      const featureOnlyRows = feature ? featureRows(feature, featureIndex) : [];
      const visible = featureOnlyRows.filter(row => matchesFilter(row) && shouldShowRow(row));
      document.getElementById("scenarioPanelTitle").textContent = feature ? `${feature.name} · Scenario / Examples` : "Scenario / Examples";
      document.getElementById("visibleCount").textContent = `${visible.length} 项`;

      if (!visible.length) {
        state.selectedId = null;
        document.getElementById("scenarioList").innerHTML = `<div class="empty">当前 Feature 下没有匹配的 Scenario 或 Example。</div>`;
        state.scenarioScrollTop = 0;
        state.focusScenarioAfterRender = false;
        return;
      }

      if (!state.selectedId || !visible.some(row => row.id === state.selectedId)) {
        const firstExecutable = visible.find(row => row.rowType !== "outline");
        state.selectedId = (firstExecutable || visible[0]).id;
      }

      document.getElementById("scenarioList").innerHTML = visible.map(row => `
        <div class="scenario-card ${row.id === state.selectedId ? "active" : ""} ${row.rowType === "outline" ? "outline-row" : ""} ${row.rowType === "example" ? "example-row" : ""}" data-id="${row.id}" role="button" tabindex="0" aria-pressed="${row.id === state.selectedId}">
          <div class="scenario-head">
            <div class="scenario-code">${escapeHtml(scenarioNavigationCode(row))}</div>
            <div class="scenario-copy">
              <div class="scenario-name" title="${escapeAttr(row.name)}">${row.rowType === "outline" ? `<span class="outline-toggle">${isOutlineExpanded(row) ? "▼" : "▶"}</span>` : ""}<span class="scenario-type">${scenarioTypeLabel(row)}</span>${escapeHtml(row.name)}</div>
              <div class="scenario-subline">${escapeHtml(scenarioNavigationMeta(row) || (row.rowType === "example" ? row.parentName : row.feature))}</div>
            </div>
            ${statusPill(row.status)}
          </div>
          ${row.rowType === "outline" ? renderOutlineSummary(row) : ""}
          ${row.error ? `<div class="scenario-error">${escapeHtml(row.error)}</div>` : ""}
        </div>
      `).join("");

      document.querySelectorAll(".scenario-card").forEach(card => {
        const selectCard = () => {
          const row = featureOnlyRows.find(item => item.id === card.dataset.id);
          state.scenarioScrollTop = document.getElementById("scenarioList").scrollTop;
          if (row && row.rowType === "outline") {
            toggleOutline(row);
          }
          state.selectedId = card.dataset.id;
          state.focusScenarioAfterRender = true;
          state.scenarioDrawerOpen = false;
          render();
        };
        card.addEventListener("click", selectCard);
        card.addEventListener("keydown", event => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          selectCard();
        });
      });
      requestAnimationFrame(restoreScenarioListScroll);
    }

    function renderOutlineSummary(row) {
      const examples = row.examples || [];
      const passed = examples.filter(item => normalizeStatus(item.status) === "passed").length;
      const failed = examples.filter(item => normalizeStatus(item.status) === "failed").length;
      const skipped = examples.filter(item => normalizeStatus(item.status) === "skipped").length;
      return `<div class="outline-summary">
        <span class="param-chip">Examples ${examples.length}</span>
        <span class="param-chip">P ${passed}</span>
        <span class="param-chip">F ${failed}</span>
        <span class="param-chip">S ${skipped}</span>
      </div>`;
    }

    function visibleScenarioRows() {
      const feature = selectedFeature();
      const featureIndex = Number(state.selectedFeatureId || 0);
      const featureOnlyRows = feature ? featureRows(feature, featureIndex) : [];
      return featureOnlyRows.filter(row => matchesFilter(row) && shouldShowRow(row));
    }

    function selectableScenarioRows() {
      return visibleScenarioRows().filter(row => row.rowType !== "outline");
    }

    function selectScenarioRow(row) {
      if (!row) return;
      if (row.parentId) state.expandedOutlines.add(row.parentId);
      state.selectedId = row.id;
      const list = document.getElementById("scenarioList");
      state.scenarioScrollTop = list ? list.scrollTop : 0;
      state.scenarioDrawerOpen = false;
      render();
    }

    function selectAdjacentScenario(delta) {
      const rows = selectableScenarioRows();
      if (!rows.length) return;
      const index = rows.findIndex(row => row.id === state.selectedId);
      const nextIndex = index < 0 ? (delta > 0 ? 0 : rows.length - 1) : index + delta;
      if (nextIndex < 0 || nextIndex >= rows.length) return;
      selectScenarioRow(rows[nextIndex]);
    }

    function selectNextAttentionScenario() {
      const rows = selectableScenarioRows();
      if (!rows.length) return;
      const index = Math.max(0, rows.findIndex(row => row.id === state.selectedId));
      const ordered = [...rows.slice(index + 1), ...rows.slice(0, index + 1)];
      const target = ordered.find(row => ["failed", "unknown"].includes(normalizeStatus(row.status)) && row.id !== state.selectedId);
      selectScenarioRow(target);
    }

    function renderDetailNavigation() {
      const rows = selectableScenarioRows();
      const index = rows.findIndex(row => row.id === state.selectedId);
      const attentionRows = rows.filter(row => ["failed", "unknown"].includes(normalizeStatus(row.status)));
      const onlyCurrentAttention = attentionRows.length === 1 && attentionRows[0].id === state.selectedId;
      document.getElementById("detailPosition").textContent = index >= 0 ? `${index + 1} / ${rows.length}` : `0 / ${rows.length}`;
      document.getElementById("detailPrevScenario").disabled = index <= 0;
      document.getElementById("detailNextScenario").disabled = index < 0 || index >= rows.length - 1;
      document.getElementById("detailNextAttention").disabled = !attentionRows.length || onlyCurrentAttention;
    }

    function renderDetail(rows) {
      const row = rows.find(item => item.id === state.selectedId);
      const detailStatus = document.getElementById("detailStatus");
      const detailBody = document.getElementById("detailBody");
      if (!row) {
        detailStatus.className = "status-pill status-unknown";
        detailStatus.textContent = "未选择";
        detailBody.innerHTML = `<div class="empty">选择中间的 Scenario 或 Example 查看 Step 时间线。</div>`;
        return;
      }

      const normalized = normalizeStatus(row.status);
      detailStatus.className = `status-pill ${normalized === "passed" ? "status-pass" : normalized === "failed" ? "status-fail" : normalized === "skipped" ? "status-skip" : "status-unknown"}`;
      detailStatus.textContent = statusLabel(row.status);

      if (row.rowType === "outline") {
        detailBody.innerHTML = renderOutlineDetail(row);
        bindOutlineExampleLinks(detailBody);
        return;
      }

      if (row.rowType === "feature-skip") {
        detailBody.innerHTML = `
          <div class="detail-title-row"><div><div class="detail-title">${escapeHtml(row.name)}</div><div class="detail-subtitle">Feature 跳过 · ${escapeHtml(row.file || "")}</div></div></div>
          <div class="facts">
            <div class="fact"><div class="fact-label">跳过层级</div><div class="fact-value">Feature</div></div>
            <div class="fact"><div class="fact-label">包含测试场景</div><div class="fact-value">${Number(row.plannedUnits || 0)}</div></div>
            <div class="fact"><div class="fact-label">计划 BDD Step</div><div class="fact-value">${Number(row.plannedSteps || 0)}</div></div>
            <div class="fact"><div class="fact-label">原因</div><div class="fact-value">${escapeHtml(row.skipReason || "skipped")}</div></div>
          </div>
          <div class="scenario-tags">${(row.tags || []).map(tag => `<span class="tag">@${escapeHtml(tag)}</span>`).join("")}</div>`;
        return;
      }

      detailBody.innerHTML = `
        <div class="detail-title-row">
          <div>
            <div class="detail-title">${escapeHtml(row.name)}</div>
            <div class="detail-subtitle">${escapeHtml(row.rowType === "example" ? row.parentName : row.feature)} · ${escapeHtml(row.file || "")}</div>
          </div>
        </div>
        ${row.params ? `<div class="example-params">${Object.entries(row.params).map(([key, value]) => `<span class="param-chip">${escapeHtml(key)}=${escapeHtml(value)}</span>`).join("")}</div>` : ""}
        <div class="facts">
          <div class="fact"><div class="fact-label">类型</div><div class="fact-value">${row.rowType === "example" ? "Example" : "Scenario"}</div></div>
          <div class="fact"><div class="fact-label">耗时</div><div class="fact-value">${escapeHtml(row.duration || "-")}</div></div>
          <div class="fact"><div class="fact-label">失败步骤</div><div class="fact-value">${row.failedSteps}</div></div>
          <div class="fact"><div class="fact-label">附件</div><div class="fact-value">${row.attachmentCount}</div></div>
        </div>
        ${row.error ? `<div class="scenario-evidence-summary"><strong>失败摘要</strong><br>${escapeHtml(row.error)}</div>` : ""}
        <div class="scenario-tags">${(row.tags || []).map(tag => `<span class="tag">@${escapeHtml(tag)}</span>`).join("")}</div>
        ${renderScenarioAttachments(collectAttachments(row))}
        <div class="step-list">${renderSteps(row.steps || [])}</div>
      `;
    }

    function collectAttachments(row) {
      const result = [];
      (row.attachments || []).forEach(att => result.push({ ...att, source: "场景" }));
      (row.steps || []).forEach((step, index) => {
        (step.attachments || []).forEach(att => {
          const keyword = step.keyword || "Step";
          const name = step.name ? ` · ${step.name}` : "";
          result.push({ ...att, source: `${index + 1}. ${keyword}${name}` });
        });
      });
      return result;
    }

    function renderScenarioAttachments(attachments) {
      if (!attachments.length) return "";
      return `
        <div class="evidence-section">
          <div class="evidence-section-title">场景证据</div>
          <div class="evidence-section-note">失败截图、录屏和调试附件按来源汇总</div>
          ${renderAttachments(attachments)}
        </div>
      `;
    }

    function renderOutlineDetail(row) {
      const examples = row.examples || [];
      return `
        <div class="detail-title-row">
          <div>
            <div class="detail-title">${escapeHtml(row.name)}</div>
            <div class="detail-subtitle">Scenario Outline · ${escapeHtml(row.file || "")}</div>
          </div>
        </div>
        <div class="facts">
          <div class="fact"><div class="fact-label">Examples</div><div class="fact-value">${examples.length}</div></div>
          <div class="fact"><div class="fact-label">通过</div><div class="fact-value">${examples.filter(item => normalizeStatus(item.status) === "passed").length}</div></div>
          <div class="fact"><div class="fact-label">失败</div><div class="fact-value">${examples.filter(item => normalizeStatus(item.status) === "failed").length}</div></div>
          <div class="fact"><div class="fact-label">跳过</div><div class="fact-value">${examples.filter(item => normalizeStatus(item.status) === "skipped").length}</div></div>
        </div>
        ${renderExamplesTable(row)}
        <div class="empty" style="margin-top: 12px;">点击表格中的 Example 行，或展开中间 Scenario Outline 后点击 Example，可查看该行的 Step 时间线。</div>
      `;
    }

    function renderExamplesTable(row) {
      const examples = row.examples || [];
      const paramKeys = [...new Set(examples.flatMap(example => Object.keys(example.params || {})))];
      if (!examples.length) return "";
      const columns = ["Example", ...paramKeys, "状态"];
      return `<div class="examples-table-wrap">
        <div class="examples-table-title">Examples</div>
        <div class="examples-table-scroll">
          <table class="examples-table">
            <thead><tr>${columns.map(column => `<th>${escapeHtml(column)}</th>`).join("")}</tr></thead>
            <tbody>${examples.map((example, index) => `<tr data-detail-example-id="${row.id}-${index}" role="button" tabindex="0">
              <td>${escapeHtml(example.exampleId || example.name)}</td>
              ${paramKeys.map(key => `<td>${escapeHtml((example.params || {})[key] ?? "-")}</td>`).join("")}
              <td>${statusPill(example.status)}</td>
            </tr>`).join("")}</tbody>
          </table>
        </div>
      </div>`;
    }

    function bindOutlineExampleLinks(container) {
      container.querySelectorAll("[data-detail-example-id]").forEach(item => {
        const selectExample = () => {
          const id = item.dataset.detailExampleId;
          const parentId = id.split("-").slice(0, 2).join("-");
          state.expandedOutlines.add(parentId);
          state.selectedId = id;
          render();
        };
        item.addEventListener("click", selectExample);
        item.addEventListener("keydown", event => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          selectExample();
        });
      });
    }

    function renderSteps(steps) {
      if (!steps.length) return `<div class="empty">该场景没有步骤明细。</div>`;
      return steps.map((step, index) => {
        const normalized = normalizeStatus(step.status);
        const attachments = step.attachments || [];
        const actions = step.actions || [];
        const failedActions = actions.filter(action => normalizeStatus(action.status) === "failed");
        const hasExtra = step.error || step.diagnostic || failedActions.length || step.locator || step.root || step.action;
        return `
          <div class="step ${normalized} ${hasExtra ? "has-extra open" : ""}">
            <div class="step-main">
              <div class="step-index">${index + 1}</div>
              <div>
                <div class="step-name"><span class="bdd-keyword">${escapeHtml(step.keyword || "Step")}</span>${escapeHtml(step.name)}</div>
                <div class="step-meta">BDD Step · ${escapeHtml(step.duration || "-")}</div>
              </div>
              ${statusPill(step.status)}
            </div>
            ${hasExtra ? `<div class="step-extra">
              <div class="facts">
                <div class="fact"><div class="fact-label">关键字</div><div class="fact-value">${escapeHtml(step.keyword || "-")}</div></div>
                <div class="fact"><div class="fact-label">状态</div><div class="fact-value">${statusLabel(step.status)}</div></div>
              </div>
              ${renderActions(failedActions)}
              ${renderFailure(step)}
            </div>` : ""}
          </div>
        `;
      }).join("");
    }

    function renderActions(actions) {
      if (!actions.length) return "";
      return `<div class="action-list">${actions.map(action => {
        const target = [action.target, action.value ? `value=${action.value}` : "", action.root ? `root=${action.root}` : ""].filter(Boolean).join(" · ");
        return `<div class="action-row">
          <div class="action-name">${escapeHtml(action.name || "action")}</div>
          <div class="action-target">${escapeHtml(target || "-")}</div>
          ${statusPill(action.status || "unknown")}
        </div>`;
      }).join("")}</div>`;
    }

    function renderFailure(step) {
      return step.diagnostic
        ? renderDiagnostic(step.diagnostic, step)
        : renderError(step);
    }

    function renderError(step) {
      if (!step.error && !step.errorDetail) return "";
      const summary = step.error || "查看错误详情";
      const detail = step.errorDetail || step.error || "";
      return `
        <div class="error-box">${escapeHtml(summary)}</div>
        ${detail ? `<details class="error-detail"><summary>展开详细错误信息</summary><pre>${escapeHtml(detail)}</pre></details>` : ""}
      `;
    }

    function renderDiagnostic(diagnostic, step) {
      if (!diagnostic) return "";
      const rawDetail = step.errorDetail || step.error || "";
      const facts = [
        diagnostic.locator_name ? `目标=${diagnostic.locator_name}` : "",
        diagnostic.root_name ? `窗口=${diagnostic.root_name}` : "",
        diagnostic.wait_type ? `等待=${diagnostic.wait_type}` : "",
        diagnostic.probe_count != null ? `检查=${diagnostic.probe_count}次` : "",
        diagnostic.candidate_count != null ? `候选=${diagnostic.candidate_count}` : "",
      ].filter(Boolean).join(" · ");
      const cause = rawDetail
        ? ""
        : [diagnostic.cause_type, diagnostic.cause_message].filter(Boolean).join(": ");
      return `
        <div class="error-box"><strong>排障摘要：</strong>${escapeHtml(diagnostic.summary || diagnostic.code || "运行失败")}</div>
        <details class="error-detail"><summary>展开技术诊断</summary><pre>${escapeHtml([
          `code=${diagnostic.code || "-"}`,
          `category=${diagnostic.category || "-"}`,
          `stage=${diagnostic.stage || "-"}`,
          facts,
          cause ? `cause=${cause}` : "",
          rawDetail ? `原始错误:\n${rawDetail}` : "",
        ].filter(Boolean).join("\n"))}</pre></details>
      `;
    }

    function renderAttachments(attachments) {
      if (!attachments.length) return "";
      return `<div class="attachment-grid">${attachments.map(att => {
        return `<div class="attachment">
          <span class="attachment-type">${escapeHtml(att.type || "file")}</span>
          <span class="attachment-main">
            <span class="attachment-source">${escapeHtml(att.source || "")}</span>
            <a href="${safeAttachmentHref(att.path)}" target="_blank" rel="noopener noreferrer">${escapeHtml(att.name || "附件")}</a>
          </span>
        </div>`;
      }).join("")}</div>`;
    }

    function render() {
      const rows = flattenRows();
      const summary = computeSummary(rows);
      document.getElementById("reportTitle").textContent = "Feature 分组执行表";
      document.getElementById("reportMeta").textContent = `${reportData.title || "测试执行报告"} · ${reportData.project || ""} · ${reportData.startedAt || ""} · ${reportData.duration || ""}`;
      document.getElementById("sidebarProject").textContent = reportData.project || "BDD Autowork";
      document.getElementById("sidebarRunMeta").textContent = `${reportData.startedAt || ""} · ${reportData.duration || ""}`;
      if (state.view === "overview") {
        renderOverview(rows, summary);
      } else {
        const previousDetailId = state.lastRenderedDetailId;
        renderFeatureSelect();
        renderList(rows);
        renderDetail(rows);
        renderDetailNavigation();
        if (previousDetailId !== state.selectedId) {
          document.getElementById("detailBody").scrollTop = 0;
          state.lastRenderedDetailId = state.selectedId;
        }
        const scenarioPanel = document.getElementById("scenarioPanel");
        const drawerToggle = document.getElementById("scenarioDrawerToggle");
        scenarioPanel.classList.toggle("drawer-open", state.scenarioDrawerOpen);
        drawerToggle.setAttribute("aria-expanded", String(state.scenarioDrawerOpen));
        drawerToggle.textContent = state.scenarioDrawerOpen ? "收起" : "展开";
      }
      setView(state.view);
      document.querySelectorAll("[data-filter]").forEach(item => item.classList.toggle("active", item.dataset.filter === state.filter));
    }

    function setFilter(filter) {
      state.filter = filter;
      document.querySelectorAll("[data-filter]").forEach(item => item.classList.toggle("active", item.dataset.filter === filter));
      render();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    function safeAttachmentHref(value) {
      const path = String(value ?? "").trim();
      const normalized = [...path].filter(char => char.charCodeAt(0) > 32 && char.charCodeAt(0) !== 127).join("");
      if (!path || /^[a-z][a-z0-9+.-]*:/i.test(normalized) || normalized.startsWith("/") || normalized.charCodeAt(0) === 92) return "#";
      return escapeAttr(path);
    }

    document.querySelectorAll("[data-filter]").forEach(item => {
      item.addEventListener("click", () => setFilter(item.dataset.filter));
    });

    document.querySelectorAll("[data-view-target]").forEach(item => {
      item.addEventListener("click", () => {
        if (item.dataset.viewTarget === "details") openDetails();
        else {
          state.view = "overview";
          render();
        }
      });
    });

    document.getElementById("featureExecutionTree").addEventListener("click", event => {
      const featureRow = event.target.closest("[data-toggle-feature]");
      if (featureRow) {
        if (executionFilterActive()) return;
        const featureId = Number(featureRow.dataset.toggleFeature);
        if (state.collapsedFeatures.has(featureId)) state.collapsedFeatures.delete(featureId);
        else state.collapsedFeatures.add(featureId);
        render();
        return;
      }
      const row = event.target.closest("[data-execution-row-id]");
      if (!row) return;
      const scroller = document.getElementById("executionScroll");
      state.executionScrollLeft = scroller.scrollLeft;
      state.executionScrollTop = scroller.scrollTop;
      const featureId = row.dataset.executionFeatureId;
      const rowId = row.dataset.executionRowId;
      openDetails({ featureId, rowId });
    });

    document.getElementById("executionStatusFilters").addEventListener("click", event => {
      const button = event.target.closest("[data-execution-status]");
      if (!button) return;
      state.executionStatus = button.dataset.executionStatus;
      render();
    });

    document.getElementById("featureSortControl").addEventListener("click", event => {
      const button = event.target.closest("[data-feature-sort]");
      if (!button) return;
      state.featureSort = button.dataset.featureSort;
      document.querySelectorAll("#featureSortControl [data-feature-sort]").forEach(item => {
        const active = item === button;
        item.classList.toggle("active", active);
        item.setAttribute("aria-pressed", String(active));
      });
      document.getElementById("executionSortDescription").textContent = ({
        original: "Feature 内按 Gherkin 原始顺序排列",
        attention: "Feature 按需跟进数量排序；组内规格顺序不变",
        duration: "Feature 按总耗时排序；组内规格顺序不变",
      })[state.featureSort];
      render();
    });

    document.getElementById("executionSearchInput").addEventListener("input", event => {
      state.executionSearch = event.target.value.trim();
      render();
    });

    document.getElementById("executionScroll").addEventListener("scroll", event => {
      if (state.view !== "overview") return;
      state.executionScrollLeft = event.currentTarget.scrollLeft;
      state.executionScrollTop = event.currentTarget.scrollTop;
    });

    document.getElementById("executionCollapseAll").addEventListener("click", () => {
      const entries = orderedFeatureEntries();
      const allCollapsed = entries.length > 0 && entries.every(entry => state.collapsedFeatures.has(entry.featureIndex));
      entries.forEach(entry => allCollapsed ? state.collapsedFeatures.delete(entry.featureIndex) : state.collapsedFeatures.add(entry.featureIndex));
      render();
    });

    const executionTooltip = document.getElementById("executionTooltip");
    document.getElementById("featureExecutionTree").addEventListener("pointermove", event => {
      const row = event.target.closest("[data-execution-row-id]");
      if (!row) {
        executionTooltip.style.display = "none";
        return;
      }
      executionTooltip.innerHTML = `<strong>${escapeHtml(row.dataset.executionName)}</strong><br>${statusLabel(row.dataset.executionStatus)} · ${escapeHtml(row.dataset.executionDuration || "-")}`;
      executionTooltip.style.display = "block";
      executionTooltip.style.left = `${Math.min(innerWidth - 380, event.clientX + 12)}px`;
      executionTooltip.style.top = `${Math.min(innerHeight - 70, event.clientY + 12)}px`;
    });
    document.getElementById("featureExecutionTree").addEventListener("pointerleave", () => {
      executionTooltip.style.display = "none";
    });

    document.getElementById("detailFeatureSelect").addEventListener("change", event => {
      state.selectedFeatureId = event.target.value;
      state.selectedId = null;
      state.scenarioScrollTop = 0;
      state.scenarioDrawerOpen = false;
      render();
    });

    document.getElementById("scenarioDrawerToggle").addEventListener("click", () => {
      state.scenarioDrawerOpen = !state.scenarioDrawerOpen;
      render();
    });

    document.getElementById("detailPrevScenario").addEventListener("click", () => selectAdjacentScenario(-1));
    document.getElementById("detailNextScenario").addEventListener("click", () => selectAdjacentScenario(1));
    document.getElementById("detailNextAttention").addEventListener("click", selectNextAttentionScenario);

    document.getElementById("searchInput").addEventListener("input", event => {
      state.search = event.target.value.trim();
      state.scenarioScrollTop = 0;
      render();
    });

    render();
  </script>
</body>
</html>
